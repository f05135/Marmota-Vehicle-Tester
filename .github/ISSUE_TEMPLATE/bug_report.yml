name: Bug Report
description: Report a crash, datamine parsing issue, or incorrect vehicle/mission behavior.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting an issue! Please fill in the details below so we can reproduce and fix it quickly.
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - Windows 11
        - Windows 10
        - macOS (Apple Silicon)
        - macOS (Intel)
        - Linux (Source build)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: App Version
      placeholder: "e.g. v2.0.0"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the issue clearly, including the vehicle ID or mission name if applicable.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Open Marmota Vehicle Tester
        2. Select vehicle '...'
        3. Click '...'
  - type: textarea
    id: logs
    attributes:
      label: Logs / Diagnostic Info
      description: Attach your diagnostic ZIP (from Settings -> Export Diagnostic ZIP) or paste relevant lines from `app.log`.
      render: text
