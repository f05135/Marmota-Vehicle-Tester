[package]
name = "marmota_vehicle_tester"
version = "2.0.0"
edition = "2021"
default-run = "marmota_vehicle_tester"
build = "build.rs"
authors = ["f05135 <https://github.com/f05135>"]
description = "Marmota Vehicle Tester - Industrial War Thunder vehicle inspector, ballistics lab & UserMissions loadout manager"
license = "GPL-3.0-or-later"
repository = "https://github.com/f05135/Marmota-Vehicle-Tester"

[dependencies]
tokio = { version = "1.40", features = ["full"] }
axum = { version = "0.8", features = ["json", "query"] }
tower-http = { version = "0.6", features = ["fs", "cors", "trace"] }
tower = { version = "0.5", features = ["util"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
rusqlite = { version = "0.32", features = ["bundled"] }
flate2 = "1.0"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
walkdir = "2.5"
webbrowser = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tracing-appender = "0.2"
open = "5.3"
regex = "1.10"
wry = "0.57"
tao = "0.37"
image = { version = "0.25.10", default-features = false, features = ["png"] }
dirs = "7.0.0"
rust-embed = "8.5"
mime_guess = "2.0.5"
rfd = "0.15"
sys-locale = "0.3"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = "none"

[package.metadata.bundle]
name = "Marmota Vehicle Tester"
identifier = "com.marmota.vehicletester"
icon = ["packaging/macos/AppIcon.icns", "packaging/windows/app.ico", "ui/branding/logo.png"]
version = "2.0.0"
resources = []
copyright = "Copyright (c) Marmota Vehicle Tester Contributors. GPL-3.0-or-later."
category = "public.app-category.utilities"
short_description = "War Thunder vehicle loadout and UserMissions manager"
long_description = "Configure aircraft, helicopter, tank, and naval loadouts and apply them cleanly to local War Thunder UserMissions."
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["packaging/macos/Info.plist"]

[package.metadata.packager]
product-name = "Marmota Vehicle Tester"
identifier = "com.marmota.vehicletester"
version = "2.0.0"
icons = ["packaging/macos/AppIcon.icns", "packaging/windows/app.ico"]
category = "Utility"
short-description = "War Thunder vehicle loadout and UserMissions manager"
